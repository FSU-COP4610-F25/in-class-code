start:
  description: In the campus library, a calm afternoon light spills across the tables. A student reviews notes for COP4610. Across the aisle sits Professor Dr. Liu, focused on a stack of operating systems papers with colorful sticky notes labeled "deadlock," "paging," and "race conditions."
  image: img/library.jpg
  1:
    description: Greet Dr. Liu like a brave process requesting CPU time
    next: introduce_self
  2:
    description: Keep reading while quietly observing the legend of COP4610 in the wild
    next: shy_glance
  3:
    description: Oops, you drop your textbook and create an I/O interrupt
    next: book_drop

introduce_self:
  description: You step closer and speak in a low voice. "Hi Professor Liu, I am in COP4610 this semester. My scheduling algorithm for life is FIFO, so I came here first."
  image: img/library_talk.jpg
  1:
    description: Dr. Liu smiles. "Hello. I like students who can compile jokes without errors."
    next: friendly_chat
  2:
    description: Dr. Liu raises an eyebrow, amused but cautious. "FIFO for life? Careful. Priority inversion happens."
    next: awkward_moment

shy_glance:
  description: You decide to study while peeking at Dr. Liu’s notes. You accidentally make eye contact. Dr. Liu nods politely like a kernel acknowledging a system call.
  image: img/eye_contact.jpg
  1:
    description: Panic and alt+tab back to your notes
    next: embarrassed
  2:
    description: Return the nod and say hello with confidence
    next: friendly_chat

book_drop:
  description: Your book hits the floor. Page 404. Content not found. Dr. Liu looks up, then down at the fallen chapter on deadlocks, then back at you.
  image: img/book_fall.jpg
  1:
    description: Dr. Liu helps you pick it up. "Careful. That is a classic resource."
    next: friendly_chat
  2:
    description: Dr. Liu gestures kindly for you to continue, then resumes grading.
    next: embarrassed

friendly_chat:
  description: You chat for a short moment. The topic drifts from pizza scheduling to real scheduling. Dr. Liu’s replies are concise and witty. Every sentence compiles on the first try.
  image: img/library_chat.jpg
  1:
    description: Invite Dr. Liu to a quick coffee chat to ask about the next assignment spec
    next: start
  2:
    description: Exchange contact info through proper channels. "I will send questions via Canvas or email with a clear subject line."
    next: start
  3:
    description: Ask for one study tip. Promise to document it in your repo’s README
    next: start

awkward_moment:
  description: The air is slightly awkward. Your brain triggers a soft page fault. You search the TLB and only find memes.
  image: img/awkward.jpg
  1:
    description: Retreat gracefully. "Thank you, Professor. I will debug my courage and try again later."
    next: start
  2:
    description: Recover with a real question. "Could you share a quick intuition for deadlock prevention vs avoidance?"
    next: friendly_chat

embarrassed:
  description: You sit back down and breathe. Your embarrassment runs as a zombie process for five seconds, then gets reaped by init. You consider a better approach.
  image: img/embarrassed.jpg
  1:
    description: Pack up for now and reboot your social kernel later
    next: start
  2:
    description: Gather courage and re-approach with a focused COP4610 question
    next: introduce_self
